<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG image source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,800;1,400&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Source for og-image.jpg (1200x630). Not linked from the site. */
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .waves { height: 132px; }
  .og { display: grid; grid-template-columns: 1fr 400px; align-items: center; gap: 30px; padding: 0 70px; height: 498px; }
  .og h1 { font-size: 132px; line-height: .92; font-weight: 800; text-shadow: .035em .035em 0 rgba(29,26,24,.85); }
  .og h1 .line { display: block; }
  .og .tagline { font-size: 34px; margin-top: 18px; }
  .og .url { font-weight: 600; font-size: 26px; margin-top: 10px; color: var(--ink-soft); }
  .og .photo { max-width: 360px; margin-top: -40px; }
</style></head>
<body>
<div class="waves"></div>
<div class="og">
  <div>
    <h1><span class="line"><span class="c1">B</span><span class="c2">A</span><span class="c3">B</span><span class="c4">Y</span></span><span class="line"><span class="c5">S</span><span class="c6">I</span><span class="c7">T</span><span class="c8">T</span><span class="c9">I</span><span class="c10">N</span><span class="c11">G</span></span></h1>
    <p class="tagline">Safe and Caring Childcare Services</p>
  </div>
  <div class="photo"><img src="/mae.jpg" alt=""></div>
</div>
</body></html>
